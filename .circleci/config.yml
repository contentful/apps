version: 2.1

orbs:
  node: circleci/node@7.2.1
  vault: contentful/vault@1.30.5

commands:
  publish:
    steps:
      - vault/get-secrets:
          template-preset: 'semantic-release-ecosystem'
      - vault/configure-lerna
      - run:
          name: Setup GitHub packages
          command: |
            echo "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_WRITE_TOKEN}" >> ~/.npmrc
      - run:
          name: Build packages
          command: npx lerna run build --stream --scope=@contentful/dam-app-base --scope=@contentful/ecommerce-app-base --scope=@contentful/eslint-plugin-contentful-apps
      - run:
          name: Publish packages
          command: npm run publish-packages

  set_since:
    steps:
      - run:
          name: Set SINCE environment variable
          command: |
            if [ "$CIRCLE_BRANCH" = "master" ] || [ "$CIRCLE_BRANCH" = "staging" ]; then
              echo "export SINCE=HEAD^" >> $BASH_ENV
            else
              echo "export SINCE=master" >> $BASH_ENV
            fi
            source $BASH_ENV

  run_allow_scripts:
    description: 'Run LavaMoat allow-scripts for packages that use it'
    steps:
      - run:
          name: Run allow-scripts (lifecycle scripts for whitelisted packages)
          command: |
            for pkg in apps/bedrock-content-generator apps/ai-content-generator apps/vercel/frontend apps/graphql-playground; do
              if [ -f "$pkg/package.json" ] && grep -q '"allow-scripts"' "$pkg/package.json" && [ -d "$pkg/node_modules/@lavamoat/allow-scripts" ]; then
                (cd "$pkg" && npm run allow-scripts)
              fi
            done

executors:
  node:
    parameters:
      resource_class:
        type: string
        default: medium
    docker:
      - image: cimg/node:24.22.1
    resource_class: << parameters.resource_class >>
    environment:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  apps-test:
    executor:
      name: node
      resource_class: medium+
    steps:
      - checkout
      - set_since
      - run:
          name: Check Node.js versions
          command: npm run node:check
      - run:
          name: Install dependencies
          no_output_timeout: 30m
          command: |
            npm ci
            npm run bootstrap:ci
      - run_allow_scripts
      - run:
          name: Check for prettier violations
          command: |
            git fetch origin master # circleci doesn't fetch master by default
            ./.circleci/prettier-check.sh
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Verify project configurations
          command: npm run verify-config
      - run:
          name: Test
          command: npm run test
      - store_artifacts:
          path: /tmp/artifacts

  build:
    executor:
      name: node
      resource_class: medium+
    working_directory: ~/apps
    steps:
      - checkout
      - set_since
      - run:
          name: Install dependencies
          no_output_timeout: 30m
          command: |
            npm ci
            npm run bootstrap:ci
      - run_allow_scripts
      - run:
          name: Build
          command: |
            NODE_ENV='production' \
            npm run build

  build-deploy-staging:
    executor:
      name: node
      resource_class: medium+
    steps:
      - vault/get-secrets:
          template-preset: 'aws-push-artifacts'
      - checkout
      - set_since
      - run:
          name: Bootstrap
          command: |
            npm ci
            npm run bootstrap:ci
      - run_allow_scripts
      - run:
          name: Install awscli
          command: |
            sudo apt-get update
            sudo apt-get install -y python3-venv
            python3 -m venv "$HOME/awscli"
            "$HOME/awscli/bin/pip" install awscli==1.46.1
            echo 'export PATH="$HOME/awscli/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Build
          command: |
            VITE_ENV='test' \
            REACT_APP_BACKEND_BASE_URL=$BACKEND_BASE_URL_TEST \
            REACT_APP_SLACK_CLIENT_ID=$SLACK_CLIENT_ID_TEST \
            NODE_ENV='staging' \
            npm run build
      - run:
          name: Deploy apps to staging
          command: |
            STATIC_S3_BASE="s3://cf-apps-static-dev/apps" \
            STATIC_TEST_S3_BASE="s3://cf-apps-static-dev/apps/apps-test-$CIRCLE_SHA1" \
            STATIC_KLAVIYO_S3_BASE="s3://cf-apps-klaviyo/apps" \
            VITE_ENV='test' \
            REACT_APP_BACKEND_BASE_URL=$BACKEND_BASE_URL_TEST \
            REACT_APP_SLACK_CLIENT_ID=$SLACK_CLIENT_ID_TEST \
            STAGE='test' npm run deploy:test
      - run:
          name: Invalidate Slack staging cloudfront distribution
          command: aws cloudfront create-invalidation --distribution-id $SLACK_TEST_CLOUDFRONT_DIST_ID --paths "/*"

  build-deploy-prod:
    executor:
      name: node
      resource_class: medium+
    steps:
      - vault/get-secrets:
          template-preset: 'aws-push-artifacts'
      - checkout
      - set_since
      - run:
          name: Bootstrap
          command: |
            npm ci
            npm run bootstrap:ci
      - run_allow_scripts
      - run:
          name: Install awscli
          command: |
            sudo apt-get update
            sudo apt-get install -y python3-venv
            python3 -m venv "$HOME/awscli"
            "$HOME/awscli/bin/pip" install awscli==1.46.1
            echo 'export PATH="$HOME/awscli/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Build
          command: |
            REACT_APP_BACKEND_BASE_URL=$APP_SLACK_BACKEND_BASE_URL_PROD \
            REACT_APP_SLACK_CLIENT_ID=$SLACK_CLIENT_ID_PROD \
            NODE_ENV='production' \
            npm run build
      - publish
      - run:
          name: Deploy apps to prod
          command: |
            STATIC_S3_BASE="s3://cf-apps-static/apps" \
            STATIC_JIRA_S3_BASE="s3://cf-apps-jira" \
            STATIC_KLAVIYO_S3_BASE="s3://cf-apps-klaviyo/apps" \
            REACT_APP_BACKEND_BASE_URL=$APP_SLACK_BACKEND_BASE_URL_PROD \
            REACT_APP_SLACK_CLIENT_ID=$SLACK_CLIENT_ID_PROD \
            STAGE='prd' npm run deploy
      - run:
          name: Post Deploy
          command: npm run post-deploy
      - run:
          name: Sentry Release
          command: npm run sentry-release
      - run:
          name: Invalidate Slack cloudfront distribution
          command: aws cloudfront create-invalidation --distribution-id $SLACK_PRD_CLOUDFRONT_DIST_ID --paths "/*"

  test-ts-example:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: cd examples/typescript && npm i
      - run:
          name: Build
          command: cd examples/typescript && npm run build
      - run:
          name: Test
          command: cd examples/typescript && npm run test

  test-js-example:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: cd examples/javascript && npm i
      - run:
          name: Build
          command: cd examples/javascript && npm run build
      - run:
          name: Test
          command: cd examples/javascript && npm run test

workflows:
  version: 2
  test-deploy:
    jobs:
      - apps-test
      - build:
          filters:
            branches:
              ignore:
                - master
                - staging
      - breakglass:
          type: approval
          requires:
            - apps-test
          filters:
            branches:
              only:
                - master
      - build-deploy-staging:
          context:
            - vault
            - apps-staging
          requires:
            - breakglass
          filters:
            branches:
              only:
                - master
      - build-deploy-prod:
          context:
            - vault
            - apps-production
          requires:
            - breakglass
          filters:
            branches:
              only:
                - master
      - test-ts-example
      - test-js-example
